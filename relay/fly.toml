# Fly.io deploy config for the simulcast relay.
# Deploy with:  fly launch --copy-config --now   (first time)
#          or:  fly deploy                        (updates)
#
# Set the shared secret once:  fly secrets set RELAY_SECRET=<same-value-as-vercel>
# Then in Vercel set:  RELAY_URL=https://<app-name>.fly.dev  and the same RELAY_SECRET.

app = "cane-simulcast-relay"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: the machine sleeps when idle (cost ~= $0) and auto-starts on
  # the /start call when you go live. The studio sends a heartbeat every 60s
  # while broadcasting so it stays awake for the whole show, then sleeps again.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # The studio POSTs /api/simulcast/warm when the page mounts (wakes the machine
  # and waits for MediaMTX), then polls /status every 5s for the whole broadcast,
  # which keeps it awake. Without the warm call the first Go Live races the cold
  # start and /start returns 503.

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  # The relay re-encodes once (CBR, 2s GOP) and tees the result to every
  # destination. That is a real x264 workload, and a shared slice gets throttled
  # mid-show, which shows up as dropped frames and mush on YouTube.
  #   720p30  @ 4500k -> performance-1x is enough
  #   1080p30 @ 6000k -> performance-2x
  # Override the profile with OUT_WIDTH / OUT_HEIGHT / OUT_FPS / OUT_BITRATE_KBPS.
  size = "performance-1x"
  memory = "2048mb"

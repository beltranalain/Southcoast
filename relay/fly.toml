# Fly.io deploy config for the simulcast relay.
# Deploy with:  fly launch --copy-config --now   (first time)
#          or:  fly deploy                        (updates)
#
# Set the shared secret once:  fly secrets set RELAY_SECRET=<same-value-as-vercel>
# Then in Vercel set:  RELAY_URL=https://<app-name>.fly.dev  and the same RELAY_SECRET.

app = "cane-simulcast-relay"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always on. This relay holds a live ffmpeg process with no
  # inbound traffic, so auto-stop would kill a broadcast mid-stream.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
